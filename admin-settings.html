<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <meta name="robots" content="noindex, nofollow">
    <title>工作室設定 | 允藝設計工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page" data-page="admin" data-solid-nav="true">

    <div data-site-nav></div>

    <section class="admin-header">
        <div class="container admin-header-inner">
            <div>
                <h1>工作室設定</h1>
                <p>編輯前台顯示的工作室名稱、聯絡方式、首頁圖片與關於我們內容。</p>
            </div>
            <div class="admin-header-actions">
                <a href="index.html" class="btn btn-secondary">查看首頁</a>
                <a href="contact.html" class="btn btn-secondary">查看聯絡頁</a>
                <a href="about.html" class="btn btn-secondary">查看關於頁</a>
                <button id="logout-btn" type="button" class="btn btn-primary" hidden>登出</button>
            </div>
        </div>
    </section>

    <main class="admin-main">
        <div class="container">
            <p id="admin-message" class="admin-message" hidden></p>

            <section id="login-section" class="admin-panel">
                <h2>後台登入</h2>
                <form id="login-form" class="admin-form">
                    <label>
                        管理密碼
                        <div class="admin-password-field">
                            <input type="password" id="password" required autocomplete="current-password" placeholder="輸入後台密碼">
                            <button type="button" class="admin-password-toggle" data-password-toggle aria-label="顯示密碼" aria-pressed="false">
                                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                                </svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-3.89-6-7-11-7-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 3.89 6 7 11 7 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                                </svg>
                            </button>
                        </div>
                    </label>
                    <button type="submit" class="btn btn-primary">登入</button>
                </form>
            </section>

            <section id="admin-section" hidden>
                <nav id="admin-subnav" class="admin-subnav" aria-label="後台功能"></nav>

                <div class="admin-card admin-settings-panel">
                    <form id="settings-form" class="admin-form">
                        <div class="admin-form-section">
                            <h2>品牌資訊</h2>
                            <label>
                                工作室名稱
                                <input type="text" id="siteName" required>
                            </label>
                            <label>
                                英文名稱
                                <input type="text" id="siteNameEn" required>
                            </label>
                            <label>
                                品牌標語
                                <input type="text" id="tagline">
                            </label>
                            <label>
                                頁尾介紹
                                <textarea id="footerDesc" rows="2"></textarea>
                            </label>
                        </div>

                        <div class="admin-form-section">
                            <h2>首頁圖片</h2>
                            <p class="admin-field-hint">首頁右側三張拼貼圖，上傳後會自動儲存並加上浮水印。文字欄位請按下方「儲存設定」。</p>

                            <label>
                                主圖（左側大圖）
                                <input type="file" id="heroImageLargeFile" accept="image/*">
                                <div id="heroImageLargePreview" class="admin-upload-preview" hidden></div>
                            </label>
                            <input type="hidden" id="heroImageLarge">

                            <label>
                                右上小圖
                                <input type="file" id="heroImageSmall1File" accept="image/*">
                                <div id="heroImageSmall1Preview" class="admin-upload-preview" hidden></div>
                            </label>
                            <input type="hidden" id="heroImageSmall1">

                            <label>
                                右下小圖
                                <input type="file" id="heroImageSmall2File" accept="image/*">
                                <div id="heroImageSmall2Preview" class="admin-upload-preview" hidden></div>
                            </label>
                            <input type="hidden" id="heroImageSmall2">
                        </div>

                        <div class="admin-form-section">
                            <h2>聯絡資訊</h2>
                            <p class="admin-field-hint">以下內容會顯示在「聯絡預約」頁的工作室資訊區塊。</p>
                            <label>
                                服務時間
                                <input type="text" id="serviceHours">
                            </label>
                            <label>
                                服務區域
                                <input type="text" id="serviceArea">
                            </label>
                            <label>
                                聯絡電話
                                <input type="text" id="phone">
                            </label>
                            <label>
                                電子信箱
                                <input type="email" id="email">
                            </label>
                            <label>
                                Line ID
                                <input type="text" id="lineId" placeholder="@yunyidesign">
                            </label>
                            <label>
                                聯絡頁介紹
                                <textarea id="contactIntro" rows="2"></textarea>
                            </label>
                        </div>

                        <div class="admin-form-section">
                            <h2>關於我們</h2>
                            <label>
                                頁面介紹
                                <textarea id="aboutIntro" rows="2"></textarea>
                            </label>
                            <label>
                                品牌理念（第一段）
                                <textarea id="philosophy1" rows="3"></textarea>
                            </label>
                            <label>
                                品牌理念（第二段）
                                <textarea id="philosophy2" rows="3"></textarea>
                            </label>
                            <label>
                                服務範圍
                                <textarea id="serviceScope" rows="5" placeholder="每行一項"></textarea>
                                <span class="admin-field-hint">每行輸入一項服務</span>
                            </label>
                            <div class="admin-form-row">
                                <label>
                                    年業界經驗
                                    <input type="text" id="statYears" placeholder="10+">
                                </label>
                                <label>
                                    完成設計案
                                    <input type="text" id="statProjects" placeholder="120+">
                                </label>
                                <label>
                                    法規文件協助
                                    <input type="text" id="statCompliance" placeholder="100%">
                                </label>
                            </div>
                        </div>

                        <div class="admin-form-actions">
                            <button type="submit" class="btn btn-primary">儲存設定</button>
                            <p id="settings-updated-at" class="admin-field-hint" hidden></p>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/image-compress.js"></script>
    <script src="js/watermark.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/common.js"></script>
    <script src="js/site-settings.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-settings.js"></script>
</body>
</html>
