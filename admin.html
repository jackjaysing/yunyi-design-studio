<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理 | 允藝設計工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page" data-page="admin" data-solid-nav="true">

    <div data-site-nav></div>

    <section class="admin-header">
        <div class="container admin-header-inner">
            <div>
                <h1>作品後台管理</h1>
                <p>新增、編輯與刪除設計作品，前台作品頁會即時更新。</p>
            </div>
            <div class="admin-header-actions">
                <a href="works.html" class="btn btn-secondary">查看前台作品頁</a>
                <button id="logout-btn" type="button" class="btn btn-primary" hidden>登出</button>
            </div>
        </div>
    </section>

    <main class="admin-main">
        <div class="container">
            <p id="admin-message" class="admin-message" hidden></p>

            <section id="login-section" class="admin-panel">
                <h2>後台登入</h2>
                <form id="login-form" class="admin-form">
                    <label>
                        管理密碼
                        <input type="password" id="password" required placeholder="與 .env 的 VITE_ADMIN_PASSWORD 相同">
                    </label>
                    <button type="submit" class="btn btn-primary">登入</button>
                </form>
            </section>

            <section id="admin-section" class="admin-grid" hidden>
                <div class="admin-card">
                    <h2 id="form-title">新增作品</h2>
                    <form id="work-form" class="admin-form">
                        <label>
                            作品名稱
                            <input type="text" id="title" required>
                        </label>
                        <label>
                            分類
                            <select id="category">
                                <option value="室內設計">室內設計</option>
                                <option value="公設設計">公設設計</option>
                                <option value="景觀設計">景觀設計</option>
                            </select>
                        </label>
                        <label>
                            作品描述
                            <textarea id="description"></textarea>
                        </label>
                        <label>
                            圖片網址
                            <input type="url" id="image" placeholder="https:// 或 /uploads/xxx.jpg" required>
                        </label>
                        <label>
                            上傳圖片
                            <input type="file" id="image-file" accept="image/*">
                        </label>
                        <label>
                            年份
                            <input type="text" id="year" placeholder="2025">
                        </label>
                        <label>
                            坪數
                            <input type="text" id="area" placeholder="28 坪">
                        </label>
                        <label>
                            地點
                            <input type="text" id="location" placeholder="台北市">
                        </label>
                        <label class="admin-checkbox">
                            <input type="checkbox" id="featured">
                            設為精選作品
                        </label>
                        <div class="admin-form-actions">
                            <button type="submit" id="submit-btn" class="btn btn-primary">新增作品</button>
                            <button type="button" id="cancel-edit-btn" class="btn btn-secondary" hidden>取消編輯</button>
                        </div>
                    </form>
                </div>

                <div class="admin-card">
                    <h2>作品列表</h2>
                    <div id="works-list"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
