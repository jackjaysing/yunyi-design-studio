<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務流程 | 允藝設計工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="process" data-solid-nav="true">

    <div data-site-nav></div>

    <section class="page-hero">
        <div class="container">
            <span class="sub-title">OUR PROCESS</span>
            <h1 class="page-title">服務流程</h1>
            <p class="page-intro">從初次洽談到完工交付，我們以清楚流程與透明溝通，讓每一步都安心。</p>
        </div>
    </section>

    <main class="page-main">
        <div class="container process-list">
            <article class="process-step">
                <span class="process-number">01</span>
                <div>
                    <h2>初步諮詢</h2>
                    <p>了解您的需求、預算、時程與使用習慣，並提供現場條件與法規方向初評。</p>
                </div>
            </article>
            <article class="process-step">
                <span class="process-number">02</span>
                <div>
                    <h2>概念規劃</h2>
                    <p>提出平面配置、風格定位與材質方向，確認空間機能與動線邏輯。</p>
                </div>
            </article>
            <article class="process-step">
                <span class="process-number">03</span>
                <div>
                    <h2>設計深化</h2>
                    <p>完成 3D 示意、立面細節、燈光與收納規劃，並同步檢視法規與施工可行性。</p>
                </div>
            </article>
            <article class="process-step">
                <span class="process-number">04</span>
                <div>
                    <h2>送審與施工</h2>
                    <p>協助圖面送審、工程發包與進度控管，確保設計品質在現場確實落地。</p>
                </div>
            </article>
            <article class="process-step">
                <span class="process-number">05</span>
                <div>
                    <h2>完工驗收</h2>
                    <p>完成細部調整與驗收，交付完整資料，讓空間順利進入日常使用。</p>
                </div>
            </article>
        </div>
        <div class="container page-cta">
            <a href="contact.html" class="btn btn-primary">開始預約諮詢</a>
            <a href="works.html" class="btn btn-secondary">查看作品案例</a>
        </div>
    </main>

    <div data-site-footer></div>
    <script src="js/common.js"></script>
</body>
</html>
